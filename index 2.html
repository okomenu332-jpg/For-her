<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Sweet Girl</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #141414;
    color: #fff;
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }

  /* ===== INTRO SCREEN ===== */
  #intro {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeOut 0.8s ease 3.5s forwards;
  }
  #intro .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    color: #E50914;
    letter-spacing: 8px;
    opacity: 0;
    transform: scale(0.5);
    animation: logoIn 1.2s ease 0.3s forwards;
    text-shadow: 0 0 30px rgba(229,9,20,0.6);
  }
  #intro .sub {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    letter-spacing: 6px;
    color: #fff;
    margin-top: 12px;
    opacity: 0;
    animation: fadeIn 1s ease 1.5s forwards;
  }
  @keyframes logoIn {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeIn {
    to { opacity: 0.9; }
  }
  @keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
  }

  /* ===== PROFILE SCREEN ===== */
  #profiles {
    position: fixed;
    inset: 0;
    background: #141414;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 900;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #profiles.show { opacity: 1; z-index: 950; }
  #profiles h1 {
    font-family: 'Inter', sans-serif;
    font-size: 3rem;
    font-weight: 400;
    margin-bottom: 40px;
    letter-spacing: 1px;
  }
  .profile-grid {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .profile:hover { transform: scale(1.08); }
  .avatar {
    width: 130px;
    height: 130px;
    border-radius: 12px;
    background: linear-gradient(135deg, #E50914, #b0060f);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    border: 3px solid transparent;
    transition: border 0.2s;
  }
  .profile:hover .avatar { border: 3px solid #fff; }
  .profile p {
    margin-top: 12px;
    font-size: 1.1rem;
    color: #b3b3b3;
  }
  .profile:hover p { color: #fff; }

  /* ===== MAIN PAGE ===== */
  #main {
    display: none;
    padding-bottom: 60px;
  }
  #main.show { display: block; }

  /* Navbar */
  .navbar {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 16px 40px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .navbar .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: #E50914;
    letter-spacing: 4px;
  }
  .navbar .links {
    display: flex;
    gap: 20px;
    font-size: 14px;
    color: #e5e5e5;
  }
  .navbar .links span:hover { color: #b3b3b3; cursor: pointer; }

  /* Hero */
  .hero {
    position: relative;
    height: 70vh;
    min-height: 420px;
